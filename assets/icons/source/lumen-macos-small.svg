<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a4d"/><stop offset="1" stop-color="#241933"/>
    </linearGradient>
    <linearGradient id="flapL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35264a"/><stop offset="1" stop-color="#1f1529"/>
    </linearGradient>
    <linearGradient id="flapR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2e55"/><stop offset="1" stop-color="#2b1f3b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf0d4"/><stop offset="1" stop-color="#e6c992"/>
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#241933" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
    <g clip-path="url(#clip)">
      <!-- the terminal card, tucked in -->
      <rect x="215" y="200" width="594" height="520" rx="64" fill="url(#card)" stroke="#130c1b" stroke-width="7"/>
      <path d="M318 312 L398 362 L318 412" fill="none" stroke="#5e3550" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="452" y="384" width="150" height="46" rx="23" fill="#5e3550"/>
      <!-- pocket flaps -->
      <path d="M90 410 L940 760 L940 940 L90 940 Z" fill="url(#flapL)" stroke="#130c1b" stroke-width="7" stroke-linejoin="round"/>
      <path d="M940 410 L560 608 L940 764 Z" fill="url(#flapR)" stroke="#130c1b" stroke-width="7" stroke-linejoin="round"/>
    </g>
    <rect x="103.5" y="103.5" width="817" height="817" rx="187" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="7"/>
  </g>
</svg>
