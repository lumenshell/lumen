# Build Lumen for Linux and macOS and publish a GitHub release.
#
# Pushing a tag such as v0.2.0 (it must match the version in Cargo.toml) builds
# everything, publishes the release, and updates the Homebrew cask. A tag with a
# hyphen (v0.2.0-rc.1) makes a pre-release and leaves Homebrew alone.
#
# Running the workflow by hand (Actions > Release > Run workflow) only builds,
# so you can try a build without releasing it; the files are on the run's page.
#
# Release files (dist/install.sh downloads them by these names):
#   lumen-linux-x86_64.tar.gz, lumen-linux-aarch64.tar.gz, lumen-macos.zip
#   (a universal Lumen.app), install.sh, SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# These builds are what people install, so they use no third-party actions and
# no build cache (a poisoned cache would end up in a release), and GitHub's own
# actions are pinned to commits.

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # 22.04, so the binary needs only glibc 2.35 and runs on older distros.
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libfreetype-dev libfontconfig-dev libwayland-dev libvulkan-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - run: scripts/package-linux.sh ${{ matrix.arch }} out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-14
    env:
      # Matches LSMinimumSystemVersion in scripts/bundle-macos.sh.
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Make a universal Lumen.app
        run: |
          mkdir -p target/release
          lipo -create -output target/release/lumen \
            target/aarch64-apple-darwin/release/lumen \
            target/x86_64-apple-darwin/release/lumen
          scripts/bundle-macos.sh --no-build
          # Ad-hoc signature: not a Developer ID, so Gatekeeper still asks on
          # first launch, but Apple Silicon needs the bundle signed to run it.
          codesign --force --deep --sign - target/release/Lumen.app
          mkdir -p out
          ditto -c -k --keepParent target/release/Lumen.app out/lumen-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/install.sh artifacts/
          cd artifacts
          sha256sum lumen-* install.sh > SHA256SUMS
          cat SHA256SUMS
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          flags=""
          if [ "$prerelease" = true ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "Lumen ${GITHUB_REF_NAME#v}" \
            --generate-notes $flags lumen-* install.sh SHA256SUMS
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum lumen-macos.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Update the Homebrew cask
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      # A fine-grained token with Contents read/write on lumenshell/homebrew-tap.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push Casks/lumen.rb
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN secret, so the Homebrew cask wasn't updated"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          git clone "https://x-access-token:$TAP_TOKEN@github.com/lumenshell/homebrew-tap.git" tap
          mkdir -p tap/Casks
          # Drop the template's header comment; the tap's copy is generated.
          sed -e '1,/^cask /{/^#/d}' \
              -e "s/@VERSION@/$version/" \
              -e "s/@SHA256@/$SHA256/" \
              dist/homebrew/lumen.rb > tap/Casks/lumen.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lumen.rb
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "lumen $version"
          git push
