# Build Lumen for Linux and macOS and publish a GitHub release.
#
# Pushing a tag such as v0.2.0 (it must match the version in Cargo.toml) builds
# everything, publishes the release, and updates the Homebrew cask. A tag with a
# hyphen (v0.2.0-rc.1) makes a pre-release and leaves Homebrew alone.
#
# Running the workflow by hand (Actions > Release > Run workflow) only builds,
# so you can try a build without releasing it; the files are on the run's page.
#
# Release files (dist/install.sh downloads them by these names):
#   lumen-linux-x86_64.tar.gz, lumen-linux-aarch64.tar.gz, lumen-macos.zip
#   (a universal Lumen.app), install.sh, SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# These builds are what people install, so they use no third-party actions and
# no build cache (a poisoned cache would end up in a release), and GitHub's own
# actions are pinned to commits.

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # 22.04, so the binary needs only glibc 2.35 and runs on older distros.
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libfreetype-dev libfontconfig-dev libwayland-dev libvulkan-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - run: scripts/package-linux.sh ${{ matrix.arch }} out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal)
    # macos-14 is retired: GitHub now refuses the job before it starts.
    runs-on: macos-15
    env:
      # Matches LSMinimumSystemVersion in scripts/bundle-macos.sh.
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Make a universal Lumen.app
        run: |
          mkdir -p target/release
          lipo -create -output target/release/lumen \
            target/aarch64-apple-darwin/release/lumen \
            target/x86_64-apple-darwin/release/lumen
          scripts/bundle-macos.sh --no-build
      # With the MACOS_* secrets, the app is signed with the Developer ID and
      # notarized by Apple, so it opens without a Gatekeeper warning. Without
      # them it gets an ad-hoc signature: Apple Silicon needs some signature to
      # run it, but Gatekeeper blocks a downloaded copy on first launch.
      #
      #   MACOS_CERT_P12       the Developer ID Application certificate and key, as a base64 .p12
      #   MACOS_CERT_PASSWORD  the .p12's password
      #   MACOS_NOTARY_KEY     an App Store Connect API key (.p8), base64
      #   MACOS_NOTARY_KEY_ID  that key's ID
      #   MACOS_NOTARY_ISSUER  the Issuer ID shown above the keys list
      - name: Sign and notarize Lumen.app
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          app=target/release/Lumen.app
          mkdir -p out
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No MACOS_CERT_P12 secret, so Lumen.app has only an ad-hoc signature and isn't notarized"
            codesign --force --sign - "$app"
            ditto -c -k --keepParent "$app" out/lumen-macos.zip
            exit 0
          fi

          # A keychain of its own, deleted in the next step.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12"; exit 1; }

          # Hardened runtime and a secure timestamp are what notarization asks for.
          codesign --force --options runtime --timestamp --sign "$identity" "$app"
          codesign --verify --strict --verbose=2 "$app"

          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER") || true
          echo "$result"
          id=$(echo "$result" | jq -r '.id // empty')
          status=$(echo "$result" | jq -r '.status // "no result"')
          if [ "$status" != "Accepted" ]; then
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            echo "::error::Notarization ended with status $status"
            exit 1
          fi
          rm "$RUNNER_TEMP/notary.p8"

          # Staple the ticket, so the app opens even offline, then zip that.
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"
          ditto -c -k --keepParent "$app" out/lumen-macos.zip
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/install.sh artifacts/
          cd artifacts
          sha256sum lumen-* install.sh > SHA256SUMS
          cat SHA256SUMS
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          flags=""
          if [ "$prerelease" = true ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "Lumen ${GITHUB_REF_NAME#v}" \
            --generate-notes $flags lumen-* install.sh SHA256SUMS
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum lumen-macos.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Update the Homebrew cask
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      # A fine-grained token with Contents read/write on lumenshell/homebrew-tap.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push Casks/lumen.rb
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN secret, so the Homebrew cask wasn't updated"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          git clone "https://x-access-token:$TAP_TOKEN@github.com/lumenshell/homebrew-tap.git" tap
          mkdir -p tap/Casks
          # Drop the template's header comment; the tap's copy is generated.
          sed -e '1,/^cask /{/^#/d}' \
              -e "s/@VERSION@/$version/" \
              -e "s/@SHA256@/$SHA256/" \
              dist/homebrew/lumen.rb > tap/Casks/lumen.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lumen.rb
          git diff --cached --quiet && { echo "Cask already up to date"; exit 0; }
          git commit -m "lumen $version"
          git push
