[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-plugin"
dynamic = ["version"]
description = "Write plugins and scripts for the Lumen terminal in Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
dependencies = []

[tool.setuptools]
packages = ["lumen_plugin"]

# The one place the version is written: lumen_plugin/__init__.py.
[tool.setuptools.dynamic]
version = {attr = "lumen_plugin.__version__"}
