[package]
name = "lumen"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lumenshell/lumen"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
futures = "0.3"
gpui = "0.2.2"
libc = "0.2"
polling = "3.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = { version = "0.22", features = ["parse", "display"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
# The X11 window id of the quick terminal, which GPUI exposes this way.
raw-window-handle = "0.6"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# GPUI's XIM client panics on text its compound-text decoder rejects (plain
# Latin-1 such as "é" from ibus, Chinese and Korean charsets). This copy
# decodes those and never fails. See vendor/xim-ctext/README-lumen.md.
#
# GPUI on X11 draws only on its refresh timer, so terminal output waited up
# to a frame to appear. This copy draws as soon as a window is dirtied. See
# vendor/gpui/README-lumen.md.
[patch.crates-io]
xim-ctext = { path = "vendor/xim-ctext" }
gpui = { path = "vendor/gpui" }
